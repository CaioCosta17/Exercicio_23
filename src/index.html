<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="avatar" src="#" alt=".">
            <h1 class="profile-name" id="name"></h1>
            <h2 class="profile-username" id="username">
                <span class="bi bi-github"></span>
            </h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a id="link" href="https://github.com/CaioCosta17" class="profile-link" target="_blank">Ver no Github</a>
        </div>
    </header>

    <script src="./scripts/main.js"></script>
</body>
</html>
